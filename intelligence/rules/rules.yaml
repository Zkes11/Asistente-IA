rules:
  - id: RULE_TECH_LOGIC_001
    version: 1
    enabled: true
    priority: 10
    conditions:
      all:
        - feature: interest_technology
          operator: gte
          value: 4
        - feature: logical_reasoning
          operator: gte
          value: 4
    actions:
      - type: increase_program_score
        target: ingenieria-de-sistemas
        weight: 0.22
      - type: increase_program_score
        target: ingenieria-de-software
        weight: 0.18
    explanation:
      title: Afinidad tecnologica y logica
      template: Mostraste interes alto por la tecnologia y fortaleza en razonamiento logico.
